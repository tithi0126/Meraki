name: Deploy Meraki to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Deployment Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          timeout: 300s
          command_timeout: 20m
          script: |
            mkdir -p /home/ubuntu/Public/apps/Meraki
            mkdir -p /home/ubuntu/Public/apps/Meraki/backend
            mkdir -p /home/ubuntu/Public/apps/Meraki/frontend
            
            echo "📊 Checking disk space..."
            df -h
            echo "🛑 Stopping backend process to free file handles..."
            pm2 stop meraki-backend || echo "Process not running"
            pm2 stop meraki-frontend || echo "Process not running"

      - name: Deploy Backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "backend/*"
          target: "/home/ubuntu/Public/apps/Meraki/backend"
          strip_components: 1
          rm: false
          timeout: 120s
          command_timeout: 10m

      - name: Deploy Frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "frontend/*"
          target: "/home/ubuntu/Public/apps/Meraki/frontend"
          strip_components: 1
          rm: false
          timeout: 120s
          command_timeout: 10m

      - name: Setup and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          timeout: 120s
          command_timeout: 10m
          script: |
            # Setup Backend
            cd /home/ubuntu/Public/apps/Meraki/backend
            echo "📦 Installing backend production dependencies..."
            npm install --omit=dev --no-fund --no-audit
            
            if [ ! -f .env ]; then
              cp production_env_template.txt .env || echo "PORT=5007" > .env
            fi
            
            # Setup Frontend
            cd /home/ubuntu/Public/apps/Meraki/frontend
            echo "📦 Installing frontend production dependencies..."
            npm install --omit=dev --no-fund --no-audit
            
            if [ ! -f .env ]; then
              cp production_env_template.txt .env || echo "PORT=3007" > .env
            fi

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Restart processes
            cd /home/ubuntu/Public/apps/Meraki/backend
            NODE_ENV=production pm2 restart meraki-backend --update-env || NODE_ENV=production pm2 start server.js --name meraki-backend
            
            cd /home/ubuntu/Public/apps/Meraki/frontend
            NODE_ENV=production pm2 restart meraki-frontend --update-env || NODE_ENV=production pm2 start server.js --name meraki-frontend
            
            pm2 save
