name: Deploy Meraki to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Deployment Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            mkdir -p /home/ubuntu/Public/apps/meraki-1
            mkdir -p /home/ubuntu/Public/apps/meraki-1/backend
            mkdir -p /home/ubuntu/Public/apps/meraki-1/frontend
            
            echo "📊 Checking disk space..."
            df -h
            echo "🛑 Stopping processes to free file handles..."
            pm2 stop meraki-backend || echo "Backend not running"
            pm2 stop meraki-frontend || echo "Frontend not running"

      - name: Deploy Backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "backend/*"
          target: "/home/ubuntu/Public/apps/meraki-1/backend"
          strip_components: 1
          rm: false
          timeout: 60s
          command_timeout: 10m

      - name: Deploy Frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "frontend/*"
          target: "/home/ubuntu/Public/apps/meraki-1/frontend_tmp"
          strip_components: 1
          rm: false
          timeout: 60s
          command_timeout: 10m

      - name: Setup and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            # Move frontend files securely replacing only old files
            rsync -av /home/ubuntu/Public/apps/meraki-1/frontend_tmp/ /home/ubuntu/Public/apps/meraki-1/frontend/
            rm -rf /home/ubuntu/Public/apps/meraki-1/frontend_tmp
            
            # Setup Backend
            cd /home/ubuntu/Public/apps/meraki-1/backend
            echo "📦 Installing backend production dependencies..."
            npm install --omit=dev --no-fund --no-audit
            
            # Setup Frontend
            cd /home/ubuntu/Public/apps/meraki-1/frontend
            echo "📦 Installing frontend production dependencies..."
            npm install --omit=dev --no-fund --no-audit
            
            # Create Ecosystem to enforce env vars and paths
            cat << 'EOF' > /home/ubuntu/Public/apps/meraki-1/ecosystem.config.js
            module.exports = {
              apps: [
                {
                  name: 'meraki-backend',
                  script: 'server.js',
                  cwd: '/home/ubuntu/Public/apps/meraki-1/backend',
                  env: {
                    NODE_ENV: 'production',
                    PORT: 5007
                  }
                },
                {
                  name: 'meraki-frontend',
                  script: 'server.js',
                  cwd: '/home/ubuntu/Public/apps/meraki-1/frontend',
                  env: {
                    NODE_ENV: 'production',
                    PORT: 5006
                  }
                }
              ]
            };
            EOF
            
            cd /home/ubuntu/Public/apps/meraki-1
            
            # Ensure PM2 uses the correct envs and folders
            pm2 delete meraki-backend || true
            pm2 delete meraki-frontend || true
            
            # Start using the ecosystem config
            pm2 start ecosystem.config.js --env production
            pm2 save
